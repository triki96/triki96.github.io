<svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="900" height="460" fill="#f3f3f3"/>
  <rect x="10" y="10" width="880" height="440" rx="6" fill="#ffffff" stroke="#c0c0c0"/>
  <rect x="10" y="10" width="880" height="32" rx="6" fill="#2b579a"/>
  <text x="26" y="31" fill="#ffffff" font-size="14" font-weight="bold">Process Monitor - Filter</text>

  <!-- filter bar -->
  <rect x="26" y="54" width="848" height="60" fill="#f7f7f7" stroke="#ddd"/>
  <text x="38" y="72" font-size="12" fill="#555">Display Filter (Ctrl+L)</text>
  <rect x="38" y="80" width="140" height="24" fill="#ffffff" stroke="#aaa"/>
  <text x="46" y="96" font-size="12">Process Name</text>
  <rect x="182" y="80" width="60" height="24" fill="#ffffff" stroke="#aaa"/>
  <text x="192" y="96" font-size="12">contains</text>
  <rect x="246" y="80" width="140" height="24" fill="#ffffff" stroke="#aaa"/>
  <text x="256" y="96" font-size="12" font-weight="bold">cobalt</text>
  <rect x="600" y="80" width="70" height="24" fill="#e8f0fe" stroke="#8ab4f8"/>
  <text x="614" y="96" font-size="12" fill="#1a56c4">Include</text>

  <!-- column headers -->
  <rect x="26" y="122" width="848" height="24" fill="#eaeaea"/>
  <text x="34" y="138" font-size="11" fill="#444">Time</text>
  <text x="130" y="138" font-size="11" fill="#444">Process Name</text>
  <text x="290" y="138" font-size="11" fill="#444">Operation</text>
  <text x="430" y="138" font-size="11" fill="#444">Path / Detail</text>
  <text x="740" y="138" font-size="11" fill="#444">Result</text>

  <!-- rows -->
  <g font-size="11" fill="#333">
    <text x="34" y="164">10:41:02.1</text>
    <text x="130" y="164">cobaltstrike.exe</text>
    <text x="290" y="164">Process Start</text>
    <text x="430" y="164">C:\Users\...\cobaltstrike.exe</text>
    <text x="740" y="164">SUCCESS</text>

    <text x="34" y="186">10:41:02.4</text>
    <text x="130" y="186">cobaltstrike.exe</text>
    <text x="290" y="186">RegOpenKey</text>
    <text x="430" y="186">HKLM\...\Internet Settings</text>
    <text x="740" y="186">SUCCESS</text>

    <text x="34" y="208">10:41:03.0</text>
    <text x="130" y="208">cobaltstrike.exe</text>
    <text x="290" y="208">Load Image</text>
    <text x="430" y="208">C:\Windows\System32\ws2_32.dll</text>
    <text x="740" y="208">SUCCESS</text>
  </g>

  <!-- highlighted TCP Connect row -->
  <rect x="26" y="220" width="848" height="24" fill="#fff3f3" stroke="#f0b0b0"/>
  <text x="34" y="236" font-size="11" font-weight="bold" fill="#b00020">10:41:03.6</text>
  <text x="130" y="236" font-size="11" font-weight="bold" fill="#b00020">cobaltstrike.exe</text>
  <text x="290" y="236" font-size="11" font-weight="bold" fill="#b00020">TCP Connect</text>
  <text x="430" y="236" font-size="11" font-weight="bold" fill="#b00020">10.10.10.5:51422 -&gt; 47.120.46.210:81</text>
  <text x="740" y="236" font-size="11" font-weight="bold" fill="#b00020">SUCCESS</text>

  <g font-size="11" fill="#333">
    <text x="34" y="258">10:41:04.0</text>
    <text x="130" y="258">cobaltstrike.exe</text>
    <text x="290" y="258">TCP Send</text>
    <text x="430" y="258">10.10.10.5:51422 -&gt; 47.120.46.210:81</text>
    <text x="740" y="258">SUCCESS</text>
  </g>

  <rect x="26" y="300" width="848" height="90" fill="#fafafa" stroke="#ddd"/>
  <text x="38" y="320" font-size="12" fill="#444" font-weight="bold">Conferma incrociata</text>
  <text x="38" y="340" font-size="12" fill="#333">Procmon registra lo stesso evento visto in Process Explorer:</text>
  <text x="38" y="358" font-size="12" fill="#333">connessione TCP verso 47.120.46.210 sulla porta 81.</text>
  <text x="38" y="376" font-size="12" fill="#333">Due strumenti diversi, stesso risultato = dato affidabile.</text>
</svg>
