<svg width="680" height="340" viewBox="0 0 680 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="680" height="340" fill="#ffffff"/>
  <text x="340" y="24" text-anchor="middle" font-size="14" font-weight="600" fill="#222">ARP — da indirizzo IP a indirizzo MAC</text>

  <rect x="40" y="50" width="150" height="44" rx="6" fill="#f2f2f2" stroke="#999" stroke-width="1"/>
  <text x="115" y="70" text-anchor="middle" font-size="10" font-weight="600" fill="#333">PC A</text>
  <text x="115" y="86" text-anchor="middle" font-size="8.5" fill="#555">192.168.1.10</text>

  <rect x="255" y="50" width="170" height="44" rx="6" fill="#f2f2f2" stroke="#999" stroke-width="1"/>
  <text x="340" y="70" text-anchor="middle" font-size="10" font-weight="600" fill="#333">PC B</text>
  <text x="340" y="86" text-anchor="middle" font-size="8.5" fill="#555">192.168.1.20 — MAC sconosciuto ad A</text>

  <rect x="490" y="50" width="150" height="44" rx="6" fill="#f2f2f2" stroke="#999" stroke-width="1"/>
  <text x="565" y="70" text-anchor="middle" font-size="10" font-weight="600" fill="#333">PC C</text>
  <text x="565" y="86" text-anchor="middle" font-size="8.5" fill="#555">192.168.1.30</text>

  <text x="340" y="120" text-anchor="middle" font-size="10.5" font-weight="600" fill="#222">1. ARP Request (broadcast a tutta la rete)</text>
  <line x1="115" y1="135" x2="340" y2="135" stroke="#2fa87d" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="115" y1="135" x2="565" y2="135" stroke="#2fa87d" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="340" y="155" text-anchor="middle" font-size="9" fill="#666">"Chi ha l'IP 192.168.1.20? Rispondimi con il tuo MAC"</text>

  <line x1="40" y1="175" x2="640" y2="175" stroke="#ddd" stroke-width="1"/>

  <text x="340" y="200" text-anchor="middle" font-size="10.5" font-weight="600" fill="#222">2. Solo il proprietario dell'IP risponde (unicast)</text>
  <line x1="340" y1="215" x2="115" y2="215" stroke="#4a86e8" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="228" y="232" text-anchor="middle" font-size="9" fill="#666">ARP Reply: "Sono io, il mio MAC è aa:bb:cc:dd:ee:ff"</text>

  <text x="565" y="215" text-anchor="middle" font-size="9" fill="#999">(PC C ignora la richiesta,</text>
  <text x="565" y="228" text-anchor="middle" font-size="9" fill="#999">non è il suo IP)</text>

  <line x1="40" y1="250" x2="640" y2="250" stroke="#ddd" stroke-width="1"/>

  <text x="340" y="272" text-anchor="middle" font-size="10" font-weight="600" fill="#222">3. PC A salva la coppia IP–MAC nella propria ARP cache</text>
  <rect x="220" y="285" width="240" height="30" rx="4" fill="#f2e9fb" stroke="#8e5fd6" stroke-width="1"/>
  <text x="340" y="304" text-anchor="middle" font-size="9" font-family="Consolas, monospace" fill="#4a2e7a">192.168.1.20 → aa:bb:cc:dd:ee:ff</text>

  <text x="340" y="330" text-anchor="middle" font-size="9" fill="#888">Illustrazione schematica</text>
</svg>
