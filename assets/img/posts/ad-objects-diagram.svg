<svg width="680" height="380" viewBox="0 0 680 380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="680" height="380" fill="#ffffff"/>
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="600" fill="#222">Gli oggetti di un dominio Active Directory</text>

  <!-- Domain Controller at center top -->
  <rect x="255" y="45" width="170" height="50" rx="8" fill="#f2e9fb" stroke="#8e5fd6" stroke-width="1.2"/>
  <text x="340" y="66" text-anchor="middle" font-size="10.5" font-weight="600" fill="#4a2e7a">Domain Controller</text>
  <text x="340" y="82" text-anchor="middle" font-size="9" fill="#4a2e7a">database centrale (AD DS)</text>

  <!-- Lines to object types -->
  <line x1="340" y1="95" x2="130" y2="150" stroke="#999" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="340" y1="95" x2="270" y2="150" stroke="#999" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="340" y1="95" x2="410" y2="150" stroke="#999" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="340" y1="95" x2="550" y2="150" stroke="#999" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Utenti -->
  <rect x="55" y="150" width="150" height="60" rx="6" fill="#e7f0fd" stroke="#4a86e8" stroke-width="1"/>
  <text x="130" y="172" text-anchor="middle" font-size="10" font-weight="600" fill="#1a3d7c">Utenti</text>
  <text x="130" y="190" text-anchor="middle" font-size="8.5" fill="#1a3d7c">mario.rossi</text>

  <!-- Gruppi -->
  <rect x="195" y="150" width="150" height="60" rx="6" fill="#e6f5f0" stroke="#2fa87d" stroke-width="1"/>
  <text x="270" y="172" text-anchor="middle" font-size="10" font-weight="600" fill="#1c5c42">Gruppi</text>
  <text x="270" y="190" text-anchor="middle" font-size="8.5" fill="#1c5c42">Amministratori-IT</text>

  <!-- Computer -->
  <rect x="335" y="150" width="150" height="60" rx="6" fill="#fff3d6" stroke="#d9a441" stroke-width="1"/>
  <text x="410" y="172" text-anchor="middle" font-size="10" font-weight="600" fill="#7a5a12">Computer</text>
  <text x="410" y="190" text-anchor="middle" font-size="8.5" fill="#7a5a12">PC-CONTAB-01</text>

  <!-- Stampanti -->
  <rect x="475" y="150" width="150" height="60" rx="6" fill="#fdece7" stroke="#e06c4f" stroke-width="1"/>
  <text x="550" y="172" text-anchor="middle" font-size="10" font-weight="600" fill="#8a3a26">Stampanti</text>
  <text x="550" y="190" text-anchor="middle" font-size="8.5" fill="#8a3a26">HP-Piano2</text>

  <line x1="130" y1="210" x2="130" y2="230" stroke="#ccc" stroke-width="1"/>
  <line x1="270" y1="210" x2="270" y2="230" stroke="#ccc" stroke-width="1"/>
  <line x1="410" y1="210" x2="410" y2="230" stroke="#ccc" stroke-width="1"/>
  <line x1="550" y1="210" x2="550" y2="230" stroke="#ccc" stroke-width="1"/>
  <line x1="130" y1="230" x2="550" y2="230" stroke="#ccc" stroke-width="1"/>

  <!-- GPO applied across -->
  <rect x="130" y="245" width="420" height="50" rx="6" fill="#f2f2f2" stroke="#999" stroke-width="1"/>
  <text x="340" y="266" text-anchor="middle" font-size="10" font-weight="600" fill="#333">Group Policy (GPO)</text>
  <text x="340" y="283" text-anchor="middle" font-size="8.5" fill="#555">regole applicate automaticamente a utenti e computer</text>

  <text x="340" y="325" text-anchor="middle" font-size="9.5" fill="#666">Ogni oggetto vive nello stesso database centrale del Domain Controller</text>

  <text x="340" y="360" text-anchor="middle" font-size="9.5" fill="#888">Illustrazione schematica, non uno screenshot reale dell'interfaccia Windows</text>
</svg>
