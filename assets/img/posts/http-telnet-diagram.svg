<svg width="680" height="320" viewBox="0 0 680 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="680" height="320" fill="#ffffff"/>
  <text x="340" y="24" text-anchor="middle" font-size="14" font-weight="600" fill="#222">HTTP grezzo tramite telnet</text>

  <rect x="40" y="45" width="140" height="40" rx="6" fill="#f2f2f2" stroke="#999" stroke-width="1"/>
  <text x="110" y="70" text-anchor="middle" font-size="10.5" font-weight="600" fill="#333">telnet</text>

  <rect x="500" y="45" width="140" height="40" rx="6" fill="#e7f0fd" stroke="#4a86e8" stroke-width="1"/>
  <text x="570" y="70" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1a3d7c">Server web :80</text>

  <line x1="180" y1="80" x2="500" y2="80" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="340" y="72" text-anchor="middle" font-size="9" fill="#555">TCP connect + testo digitato a mano</text>

  <rect x="60" y="100" width="560" height="90" rx="4" fill="#111111"/>
  <text x="75" y="120" font-size="9.5" font-family="Consolas, monospace" fill="#e0e0e0">GET / HTTP/1.1</text>
  <text x="75" y="138" font-size="9.5" font-family="Consolas, monospace" fill="#e0e0e0">Host: esempio.com</text>
  <text x="75" y="156" font-size="9.5" font-family="Consolas, monospace" fill="#e0e0e0">Connection: close</text>
  <text x="75" y="174" font-size="9.5" font-family="Consolas, monospace" fill="#e0e0e0"> </text>
  <text x="450" y="180" font-size="8.5" fill="#999" text-anchor="middle">← riga vuota obbligatoria per terminare gli header</text>

  <line x1="500" y1="215" x2="180" y2="215" stroke="#2fa87d" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="340" y="207" text-anchor="middle" font-size="9" fill="#1c5c42">Risposta HTTP (status line + header + body)</text>

  <rect x="60" y="230" width="560" height="70" rx="4" fill="#111111"/>
  <text x="75" y="250" font-size="9.5" font-family="Consolas, monospace" fill="#9fd89f">HTTP/1.1 200 OK</text>
  <text x="75" y="268" font-size="9.5" font-family="Consolas, monospace" fill="#9fd89f">Content-Type: text/html</text>
  <text x="75" y="286" font-size="9.5" font-family="Consolas, monospace" fill="#9fd89f">&lt;html&gt;...&lt;/html&gt;</text>
</svg>
