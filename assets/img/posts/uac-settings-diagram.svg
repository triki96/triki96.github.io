<svg width="640" height="220" viewBox="0 0 640 220" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="220" fill="#ffffff"/>
  <rect x="30" y="20" width="580" height="170" rx="6" fill="#f7f7f7" stroke="#999" stroke-width="1.2"/>
  <rect x="30" y="20" width="580" height="26" rx="6" fill="#e2e2e2" stroke="#999" stroke-width="1"/>
  <text x="50" y="38" font-size="11" font-weight="600" fill="#333">User Account Control Settings</text>
  <circle cx="600" cy="33" r="5" fill="#e06c4f"/>
  <circle cx="580" cy="33" r="5" fill="#d9a441"/>
  <circle cx="560" cy="33" r="5" fill="#2fa87d"/>
  
  <text x="50" y="75" font-size="10.5" fill="#333">Scegli il livello di notifica:</text>
  <rect x="50" y="90" width="14" height="70" rx="3" fill="#e7f0fd" stroke="#4a86e8" stroke-width="1"/>
  <circle cx="57" cy="98" r="4" fill="#4a86e8"/>
  <text x="80" y="102" font-size="9.5" fill="#333">Notifica sempre</text>
  <text x="80" y="120" font-size="9.5" fill="#333">Notifica (con secure desktop) — default</text>
  <text x="80" y="138" font-size="9.5" fill="#333">Notifica (senza secure desktop)</text>
  <text x="80" y="156" font-size="9.5" fill="#333">Non notificare mai</text>
  <text x="320" y="205" text-anchor="middle" font-size="9.5" fill="#888">Illustrazione schematica, non uno screenshot reale dell'interfaccia Windows</text>
</svg>
