<svg width="680" height="200" viewBox="0 0 680 200" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="680" height="200" fill="#ffffff"/>
  <text x="340" y="24" text-anchor="middle" font-size="14" font-weight="600" fill="#222">Il pattern comune degli strumenti *2john</text>

  <rect x="30" y="60" width="140" height="44" rx="6" fill="#f2f2f2" stroke="#999" stroke-width="1"/>
  <text x="100" y="82" text-anchor="middle" font-size="9.5" font-weight="600" fill="#333">File protetto</text>
  <text x="100" y="97" text-anchor="middle" font-size="8" fill="#555">.zip / .rar / id_rsa</text>

  <line x1="170" y1="82" x2="240" y2="82" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="205" y="72" text-anchor="middle" font-size="8" fill="#666">zip2john / rar2john / ssh2john</text>

  <rect x="240" y="60" width="180" height="44" rx="6" fill="#e7f0fd" stroke="#4a86e8" stroke-width="1"/>
  <text x="330" y="82" text-anchor="middle" font-size="9.5" font-weight="600" fill="#1a3d7c">Hash estratto</text>
  <text x="330" y="97" text-anchor="middle" font-size="8" fill="#1a3d7c">in formato John</text>

  <line x1="420" y1="82" x2="490" y2="82" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="455" y="72" text-anchor="middle" font-size="8" fill="#666">john</text>

  <rect x="490" y="60" width="160" height="44" rx="6" fill="#e6f5f0" stroke="#2fa87d" stroke-width="1"/>
  <text x="570" y="82" text-anchor="middle" font-size="9.5" font-weight="600" fill="#1c5c42">Password/passphrase</text>
  <text x="570" y="97" text-anchor="middle" font-size="8" fill="#1c5c42">in chiaro</text>

  <text x="340" y="145" text-anchor="middle" font-size="9.5" fill="#666">John non attacca mai il file originale direttamente:</text>
  <text x="340" y="163" text-anchor="middle" font-size="9.5" fill="#666">serve sempre estrarre prima l'hash in un formato che sa interpretare</text>
</svg>
