<svg width="680" height="340" viewBox="0 0 680 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="680" height="340" fill="#ffffff"/>
  <text x="340" y="24" text-anchor="middle" font-size="14" font-weight="600" fill="#222">Frame: elenco piatto, struttura annidata</text>

  <rect x="40" y="45" width="600" height="260" rx="8" fill="#f2f2f2" stroke="#999" stroke-width="1"/>
  <text x="60" y="68" font-size="11" font-weight="600" fill="#333">Frame — metadati di cattura (timestamp, numero, lunghezza)</text>

  <rect x="60" y="80" width="560" height="210" rx="6" fill="#e7f0fd" stroke="#4a86e8" stroke-width="1"/>
  <text x="80" y="100" font-size="10.5" font-weight="600" fill="#1a3d7c">Ethernet (livello 2 — MAC sorgente/destinazione)</text>

  <rect x="80" y="112" width="520" height="168" rx="6" fill="#e6f5f0" stroke="#2fa87d" stroke-width="1"/>
  <text x="100" y="132" font-size="10.5" font-weight="600" fill="#1c5c42">Internet Protocol (livello 3 — IP sorgente/destinazione)</text>

  <rect x="100" y="144" width="480" height="126" rx="6" fill="#fff3d6" stroke="#d9a441" stroke-width="1"/>
  <text x="120" y="164" font-size="10.5" font-weight="600" fill="#7a5a12">TCP (livello 4 — porte, numeri di sequenza)</text>

  <rect x="120" y="176" width="440" height="80" rx="6" fill="#fdece7" stroke="#e06c4f" stroke-width="1"/>
  <text x="140" y="200" font-size="10.5" font-weight="600" fill="#8a3a26">Dati applicativi (livello 7 — es. HTTP)</text>
  <text x="140" y="222" font-size="9" fill="#8a3a26">GET / HTTP/1.1 ...</text>

  <text x="340" y="325" text-anchor="middle" font-size="9.5" fill="#888">In Wireshark questi livelli sono mostrati come elenco piatto, ma restano annidati byte per byte</text>
</svg>
