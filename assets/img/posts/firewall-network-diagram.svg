  <text x="50" y="38" font-size="11" font-weight="600" fill="#333">Firewall &amp; network protection</text>
  <circle cx="640" cy="33" r="5" fill="#e06c4f"/>
  <circle cx="620" cy="33" r="5" fill="#d9a441"/>
