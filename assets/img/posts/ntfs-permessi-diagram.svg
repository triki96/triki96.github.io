<svg width="640" height="420" viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="640" height="420" fill="#ffffff"/>
  <text x="320" y="26" text-anchor="middle" font-size="15" font-weight="600" fill="#222">I sei permessi NTFS, dal più al meno permissivo</text>

  <rect x="170" y="45" width="300" height="46" rx="8" fill="#fdece7" stroke="#e06c4f" stroke-width="1"/>
  <text x="320" y="63" text-anchor="middle" font-size="12" font-weight="600" fill="#8a3a26">Full Control</text>
  <text x="320" y="79" text-anchor="middle" font-size="10.5" fill="#8a3a26">controllo totale, incluse le autorizzazioni</text>

  <line x1="320" y1="91" x2="320" y2="113" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="190" y="113" width="260" height="46" rx="8" fill="#e7f0fd" stroke="#4a86e8" stroke-width="1"/>
  <text x="320" y="131" text-anchor="middle" font-size="12" font-weight="600" fill="#1a3d7c">Modify</text>
  <text x="320" y="147" text-anchor="middle" font-size="10.5" fill="#1a3d7c">modifica, elimina, tutto tranne permessi</text>

  <line x1="320" y1="159" x2="320" y2="181" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="210" y="181" width="220" height="46" rx="8" fill="#e6f5f0" stroke="#2fa87d" stroke-width="1"/>
  <text x="320" y="199" text-anchor="middle" font-size="12" font-weight="600" fill="#1c5c42">Read &amp; Execute</text>
  <text x="320" y="215" text-anchor="middle" font-size="10.5" fill="#1c5c42">legge ed esegue programmi</text>

  <line x1="320" y1="227" x2="320" y2="249" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="200" y="249" width="240" height="46" rx="8" fill="#f2e9fb" stroke="#8e5fd6" stroke-width="1"/>
  <text x="320" y="267" text-anchor="middle" font-size="12" font-weight="600" fill="#4a2e7a">List folder contents</text>
  <text x="320" y="283" text-anchor="middle" font-size="10.5" fill="#4a2e7a">solo cartelle: vede i nomi dentro</text>

  <line x1="320" y1="295" x2="320" y2="317" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="220" y="317" width="200" height="46" rx="8" fill="#f2e9fb" stroke="#8e5fd6" stroke-width="1"/>
  <text x="320" y="335" text-anchor="middle" font-size="12" font-weight="600" fill="#4a2e7a">Read</text>
  <text x="320" y="351" text-anchor="middle" font-size="10.5" fill="#4a2e7a">solo visualizzare contenuto/attributi</text>

  <line x1="60" y1="380" x2="580" y2="380" stroke="#ddd" stroke-width="1"/>

  <rect x="220" y="392" width="200" height="0" rx="0" fill="none"/>
  <rect x="220" y="388" width="200" height="24" rx="6" fill="#fff3d6" stroke="#d9a441" stroke-width="1"/>
  <text x="320" y="404" text-anchor="middle" font-size="11" font-weight="600" fill="#7a5a12">Write (indipendente, si combina liberamente)</text>
</svg>
