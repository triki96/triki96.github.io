  <rect x="26" y="230" width="848" height="70" fill="#fafafa" stroke="#ddd"/>
  <text x="38" y="250" font-size="12" font-weight="bold" fill="#444">Hex / bytes (estratto)</text>
  <text x="38" y="270" font-size="11" fill="#555" font-family="Consolas, monospace">16 03 01 00 c8 01 00 00 c4 03 03 ... (handshake TLS cifrato)</text>
  <text x="38" y="288" font-size="12" fill="#333">Traffico cifrato: contenuto non leggibile in chiaro, ma la destinazione è visibile.</text>

  <rect x="26" y="316" width="848" height="72" fill="#fff3f3" stroke="#f0b0b0"/>
  <text x="38" y="336" font-size="12" font-weight="bold" fill="#b00020">Osservazione</text>
  <text x="38" y="356" font-size="12" fill="#333">Il traffico verso 47.120.46.210 è cifrato in TLS: tipico comportamento</text>
  <text x="38" y="374" font-size="12" fill="#333">di un canale C2 che nasconde comandi e dati esfiltrati.</text>
</svg>
