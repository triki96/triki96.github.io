<svg width="700" height="360" viewBox="0 0 700 360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="700" height="360" fill="#ffffff"/>
  <text x="350" y="24" text-anchor="middle" font-size="14" font-weight="600" fill="#222">Scambio dei numeri di sequenza nel TCP handshake</text>

  <rect x="40" y="40" width="140" height="40" rx="6" fill="#f2f2f2" stroke="#999" stroke-width="1"/>
  <text x="110" y="65" text-anchor="middle" font-size="10.5" font-weight="600" fill="#333">Client</text>

  <rect x="520" y="40" width="140" height="40" rx="6" fill="#e7f0fd" stroke="#4a86e8" stroke-width="1"/>
  <text x="590" y="65" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1a3d7c">Server</text>

  <text x="350" y="110" text-anchor="middle" font-size="11" font-weight="600" fill="#222">1. SYN</text>
  <line x1="110" y1="122" x2="590" y2="122" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="350" y="116" text-anchor="middle" font-size="9" fill="#555">seq = 1000 (ISN del client)</text>

  <line x1="30" y1="145" x2="670" y2="145" stroke="#ddd" stroke-width="1"/>

  <text x="350" y="170" text-anchor="middle" font-size="11" font-weight="600" fill="#222">2. SYN-ACK</text>
  <line x1="590" y1="182" x2="110" y2="182" stroke="#4a86e8" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="350" y="176" text-anchor="middle" font-size="9" fill="#1a3d7c">seq = 5000 (ISN del server), ack = 1001</text>

  <line x1="30" y1="205" x2="670" y2="205" stroke="#ddd" stroke-width="1"/>

  <text x="350" y="230" text-anchor="middle" font-size="11" font-weight="600" fill="#222">3. ACK</text>
  <line x1="110" y1="242" x2="590" y2="242" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="350" y="236" text-anchor="middle" font-size="9" fill="#555">seq = 1001, ack = 5001</text>

  <line x1="30" y1="265" x2="670" y2="265" stroke="#ddd" stroke-width="1"/>

  <text x="350" y="290" text-anchor="middle" font-size="10" fill="#666">I due numeri di sequenza (client e server) sono indipendenti — non sono mai uguali</text>
  <text x="350" y="310" text-anchor="middle" font-size="10" fill="#666">ACK = ISN ricevuto + 1 ("mi aspetto il prossimo byte da qui")</text>
  <text x="350" y="335" text-anchor="middle" font-size="9" fill="#888">Illustrazione schematica</text>
</svg>
