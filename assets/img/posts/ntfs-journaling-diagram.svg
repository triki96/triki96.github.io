<svg width="640" height="360" viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="640" height="360" fill="#ffffff"/>
  <text x="320" y="26" text-anchor="middle" font-size="15" font-weight="600" fill="#222">Come funziona il journaling</text>

  <rect x="30" y="45" width="150" height="44" rx="8" fill="#f2f2f2" stroke="#999" stroke-width="1"/>
  <text x="105" y="71" text-anchor="middle" font-size="11" fill="#333">Modifica richiesta</text>

  <line x1="180" y1="67" x2="230" y2="67" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="230" y="45" width="170" height="44" rx="8" fill="#e7f0fd" stroke="#4a86e8" stroke-width="1"/>
  <text x="315" y="71" text-anchor="middle" font-size="11" font-weight="600" fill="#1a3d7c">1. Scrive nel Journal</text>

  <line x1="315" y1="89" x2="315" y2="120" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="230" y="120" width="170" height="44" rx="8" fill="#e6f5f0" stroke="#2fa87d" stroke-width="1"/>
  <text x="315" y="146" text-anchor="middle" font-size="11" font-weight="600" fill="#1c5c42">2. Applica ai dati reali</text>

  <line x1="400" y1="142" x2="450" y2="142" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="450" y="120" width="150" height="44" rx="8" fill="#f2f2f2" stroke="#999" stroke-width="1"/>
  <text x="525" y="146" text-anchor="middle" font-size="11" fill="#333">Operazione completata</text>

  <line x1="30" y1="190" x2="610" y2="190" stroke="#ddd" stroke-width="1"/>
  <text x="320" y="212" text-anchor="middle" font-size="12" font-weight="600" fill="#222">Se il sistema si blocca durante il passo 2 (blackout, crash)</text>

  <rect x="220" y="228" width="200" height="46" rx="8" fill="#fdece7" stroke="#e06c4f" stroke-width="1"/>
  <text x="320" y="246" text-anchor="middle" font-size="11" font-weight="600" fill="#8a3a26">Riavvio del sistema</text>
  <text x="320" y="262" text-anchor="middle" font-size="10.5" fill="#8a3a26">legge il journal</text>

  <line x1="320" y1="274" x2="320" y2="296" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="140" y="296" width="360" height="46" rx="8" fill="#f2e9fb" stroke="#8e5fd6" stroke-width="1"/>
  <text x="320" y="314" text-anchor="middle" font-size="11" font-weight="600" fill="#4a2e7a">Completa o annulla l'operazione</text>
  <text x="320" y="330" text-anchor="middle" font-size="10.5" fill="#4a2e7a">in modo coerente, mai dati corrotti a metà</text>
</svg>
