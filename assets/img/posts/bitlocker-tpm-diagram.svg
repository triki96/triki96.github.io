<svg width="680" height="190" viewBox="0 0 680 190" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="680" height="190" fill="#ffffff"/>
  <rect x="30" y="20" width="620" height="140" rx="6" fill="#f7f7f7" stroke="#999" stroke-width="1.2"/>
  <rect x="30" y="20" width="620" height="26" rx="6" fill="#e2e2e2" stroke="#999" stroke-width="1"/>
  <text x="50" y="38" font-size="11" font-weight="600" fill="#333">BitLocker Drive Encryption</text>
  <circle cx="640" cy="33" r="5" fill="#e06c4f"/>
  <circle cx="620" cy="33" r="5" fill="#d9a441"/>
  <circle cx="600" cy="33" r="5" fill="#2fa87d"/>
  
  <rect x="50" y="60" width="150" height="90" rx="6" fill="#f2e9fb" stroke="#8e5fd6" stroke-width="1"/>
  <text x="125" y="82" text-anchor="middle" font-size="10" font-weight="600" fill="#4a2e7a">TPM chip</text>
  <text x="125" y="100" text-anchor="middle" font-size="8.5" fill="#4a2e7a">custodisce la</text>
  <text x="125" y="114" text-anchor="middle" font-size="8.5" fill="#4a2e7a">chiave di cifratura</text>

  <text x="220" y="108" text-anchor="middle" font-size="12" fill="#555">+</text>

  <rect x="240" y="60" width="150" height="90" rx="6" fill="#fff3d6" stroke="#d9a441" stroke-width="1"/>
  <text x="315" y="82" text-anchor="middle" font-size="10" font-weight="600" fill="#7a5a12">PIN utente</text>
