  <text x="315" y="114" text-anchor="middle" font-size="8.5" fill="#7a5a12">o chiave USB</text>

  <text x="405" y="105" text-anchor="middle" font-size="14" fill="#555">-&gt;</text>

  <rect x="430" y="60" width="150" height="90" rx="6" fill="#e6f5f0" stroke="#2fa87d" stroke-width="1"/>
  <text x="505" y="90" text-anchor="middle" font-size="10" font-weight="600" fill="#1c5c42">Disco cifrato</text>
  <text x="505" y="108" text-anchor="middle" font-size="8.5" fill="#1c5c42">sbloccato all'avvio</text>
  <text x="340" y="175" text-anchor="middle" font-size="9.5" fill="#888">Illustrazione schematica, non uno screenshot reale dell'interfaccia Windows</text>
