<svg width="680" height="380" viewBox="0 0 680 380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="680" height="380" fill="#ffffff"/>

  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="600" fill="#222">System Configuration — struttura delle schede</text>

  <!-- Window frame -->
  <rect x="40" y="45" width="600" height="300" rx="6" fill="#f7f7f7" stroke="#999" stroke-width="1.2"/>
  <rect x="40" y="45" width="600" height="26" rx="6" fill="#e2e2e2" stroke="#999" stroke-width="1"/>
  <text x="60" y="63" font-size="11" font-weight="600" fill="#333">System Configuration</text>
  <circle cx="610" cy="58" r="5" fill="#e06c4f"/>
  <circle cx="590" cy="58" r="5" fill="#d9a441"/>
  <circle cx="570" cy="58" r="5" fill="#2fa87d"/>

  <!-- Tabs -->
  <g>
    <rect x="50" y="78" width="110" height="28" fill="#e7f0fd" stroke="#4a86e8" stroke-width="1"/>
    <text x="105" y="96" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1a3d7c">General</text>

    <rect x="160" y="78" width="110" height="28" fill="#f7f7f7" stroke="#999" stroke-width="1"/>
    <text x="215" y="96" text-anchor="middle" font-size="10.5" fill="#444">Boot</text>

    <rect x="270" y="78" width="110" height="28" fill="#f7f7f7" stroke="#999" stroke-width="1"/>
    <text x="325" y="96" text-anchor="middle" font-size="10.5" fill="#444">Services</text>

    <rect x="380" y="78" width="110" height="28" fill="#f7f7f7" stroke="#999" stroke-width="1"/>
    <text x="435" y="96" text-anchor="middle" font-size="10.5" fill="#444">Startup</text>

    <rect x="490" y="78" width="110" height="28" fill="#f7f7f7" stroke="#999" stroke-width="1"/>
    <text x="545" y="96" text-anchor="middle" font-size="10.5" fill="#444">Tools</text>
  </g>

  <!-- Content area for General tab -->
  <rect x="50" y="106" width="560" height="220" fill="#ffffff" stroke="#ccc" stroke-width="1"/>

  <text x="70" y="130" font-size="11" font-weight="600" fill="#222">Startup selection</text>

  <circle cx="80" cy="152" r="5" fill="#4a86e8"/>
  <text x="95" y="156" font-size="10.5" fill="#333">Normal startup — load all device drivers and services</text>

  <circle cx="80" cy="176" r="5" fill="none" stroke="#999" stroke-width="1.2"/>
  <text x="95" y="180" font-size="10.5" fill="#666">Diagnostic startup — load basic devices and services only</text>

  <circle cx="80" cy="200" r="5" fill="none" stroke="#999" stroke-width="1.2"/>
  <text x="95" y="204" font-size="10.5" fill="#666">Selective startup — choose services and startup items</text>

  <line x1="70" y1="220" x2="590" y2="220" stroke="#eee" stroke-width="1"/>

  <text x="70" y="245" font-size="10.5" font-weight="600" fill="#222">Altre schede (illustrate come struttura, non contenuto reale):</text>

  <rect x="70" y="258" width="120" height="50" rx="4" fill="#e6f5f0" stroke="#2fa87d" stroke-width="1"/>
  <text x="130" y="278" text-anchor="middle" font-size="10" font-weight="600" fill="#1c5c42">Boot</text>
  <text x="130" y="294" text-anchor="middle" font-size="9" fill="#1c5c42">Safe Boot, OS multipli</text>

  <rect x="200" y="258" width="140" height="50" rx="4" fill="#fdece7" stroke="#e06c4f" stroke-width="1"/>
  <text x="270" y="278" text-anchor="middle" font-size="10" font-weight="600" fill="#8a3a26">Services</text>
  <text x="270" y="294" text-anchor="middle" font-size="9" fill="#8a3a26">Hide Microsoft services</text>

  <rect x="350" y="258" width="120" height="50" rx="4" fill="#f2e9fb" stroke="#8e5fd6" stroke-width="1"/>
  <text x="410" y="278" text-anchor="middle" font-size="10" font-weight="600" fill="#4a2e7a">Startup</text>
  <text x="410" y="294" text-anchor="middle" font-size="9" fill="#4a2e7a">rimanda a Task Manager</text>

  <rect x="480" y="258" width="120" height="50" rx="4" fill="#fff3d6" stroke="#d9a441" stroke-width="1"/>
  <text x="540" y="278" text-anchor="middle" font-size="10" font-weight="600" fill="#7a5a12">Tools</text>
  <text x="540" y="294" text-anchor="middle" font-size="9" fill="#7a5a12">collegamenti rapidi</text>

  <text x="340" y="365" text-anchor="middle" font-size="9.5" fill="#888">Illustrazione schematica, non uno screenshot reale dell'interfaccia Windows</text>
</svg>
