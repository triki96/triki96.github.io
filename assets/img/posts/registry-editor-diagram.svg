  <text x="70" y="136" font-size="8.5" fill="#555">└ SYSTEM</text>
  <text x="60" y="152" font-size="9" fill="#333">HKEY_USERS</text>
  <text x="60" y="168" font-size="9" fill="#333">HKEY_CURRENT_CONFIG</text>
  <rect x="220" y="58" width="360" height="120" fill="#ffffff" stroke="#ccc" stroke-width="1"/>
  <text x="235" y="78" font-size="9" font-weight="600" fill="#333">Nome</text>
