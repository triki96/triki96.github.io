<svg width="680" height="480" viewBox="0 0 680 480" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="680" height="480" fill="#ffffff"/>

  <rect x="40" y="30" width="140" height="40" rx="6" fill="#f2f2f2" stroke="#999" stroke-width="1"/>
  <text x="110" y="54" text-anchor="middle" font-size="10.5" font-weight="600" fill="#333">Utente</text>

  <rect x="270" y="30" width="140" height="40" rx="6" fill="#e7f0fd" stroke="#4a86e8" stroke-width="1"/>
  <text x="340" y="54" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1a3d7c">KDC (sul DC)</text>

  <rect x="500" y="30" width="140" height="40" rx="6" fill="#f2f2f2" stroke="#999" stroke-width="1"/>
  <text x="570" y="54" text-anchor="middle" font-size="10.5" font-weight="600" fill="#333">Servizio</text>

  <text x="340" y="95" text-anchor="middle" font-size="11" font-weight="600" fill="#222">Fase 1 — Ottenere il TGT</text>

  <line x1="180" y1="115" x2="270" y2="115" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="225" y="110" text-anchor="middle" font-size="8" fill="#555">username + timestamp</text>
  <text x="225" y="130" text-anchor="middle" font-size="8" fill="#555">cifrato con hash password</text>

  <line x1="270" y1="150" x2="180" y2="150" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="225" y="145" text-anchor="middle" font-size="8" fill="#555">TGT (cifrato hash krbtgt)</text>
  <text x="225" y="165" text-anchor="middle" font-size="8" fill="#555">+ Session Key</text>

  <line x1="30" y1="185" x2="650" y2="185" stroke="#ddd" stroke-width="1"/>

  <text x="340" y="205" text-anchor="middle" font-size="11" font-weight="600" fill="#222">Fase 2 — Ottenere il TGS</text>

  <line x1="180" y1="225" x2="270" y2="225" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="225" y="220" text-anchor="middle" font-size="8" fill="#555">TGT + username cifrato</text>
  <text x="225" y="240" text-anchor="middle" font-size="8" fill="#555">con Session Key + SPN</text>

  <line x1="270" y1="260" x2="180" y2="260" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="225" y="255" text-anchor="middle" font-size="8" fill="#555">TGS (cifrato hash Service Owner)</text>
  <text x="225" y="275" text-anchor="middle" font-size="8" fill="#555">+ Service Session Key</text>

  <line x1="30" y1="295" x2="650" y2="295" stroke="#ddd" stroke-width="1"/>

  <text x="340" y="315" text-anchor="middle" font-size="11" font-weight="600" fill="#222">Fase 3 — Accesso al servizio</text>

  <line x1="180" y1="335" x2="500" y2="335" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="340" y="330" text-anchor="middle" font-size="8" fill="#555">Presenta il TGS</text>

  <line x1="500" y1="365" x2="180" y2="365" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="340" y="360" text-anchor="middle" font-size="8" fill="#555">Accesso concesso (decifrato con hash del servizio)</text>

  <line x1="30" y1="395" x2="650" y2="395" stroke="#ddd" stroke-width="1"/>
  <text x="340" y="420" text-anchor="middle" font-size="9.5" fill="#666">Il TGT si ottiene una volta (login); con quello si chiedono</text>
  <text x="340" y="438" text-anchor="middle" font-size="9.5" fill="#666">tanti TGS diversi, uno per servizio, senza reinserire la password</text>

  <text x="340" y="465" text-anchor="middle" font-size="9" fill="#888">Illustrazione schematica</text>
</svg>
