<svg viewBox="0 0 760 440" width="760" height="440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="440" fill="#FAFAF8"/>
  <text x="380" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1B1D1F">Tipi di scansione delle vulnerabilità</text>

  <!-- Axis labels -->
  <text x="380" y="66" text-anchor="middle" font-size="12" font-weight="600" fill="#5B5A52">DA DOVE PARTE LO SCANNER</text>
  <text x="245" y="86" text-anchor="middle" font-size="12" fill="#1B1D1F">External</text>
  <text x="515" y="86" text-anchor="middle" font-size="12" fill="#1B1D1F">Internal</text>

  <text x="40" y="260" text-anchor="middle" font-size="12" font-weight="600" fill="#5B5A52" transform="rotate(-90 40 260)">CREDENZIALI</text>
  <text x="80" y="175" text-anchor="middle" font-size="12" fill="#1B1D1F">Unauthenticated</text>
  <text x="80" y="365" text-anchor="middle" font-size="12" fill="#1B1D1F">Authenticated</text>

  <!-- Grid -->
  <line x1="120" y1="100" x2="120" y2="420" stroke="#D8D1BE" stroke-width="1.5"/>
  <line x1="380" y1="100" x2="380" y2="420" stroke="#D8D1BE" stroke-width="1.5"/>
  <line x1="640" y1="100" x2="640" y2="420" stroke="#D8D1BE" stroke-width="1.5"/>
  <line x1="120" y1="100" x2="640" y2="100" stroke="#D8D1BE" stroke-width="1.5"/>
  <line x1="120" y1="260" x2="640" y2="260" stroke="#D8D1BE" stroke-width="1.5"/>
  <line x1="120" y1="420" x2="640" y2="420" stroke="#D8D1BE" stroke-width="1.5"/>

  <!-- Quadrant: External + Unauthenticated (most common) -->
  <rect x="130" y="110" width="240" height="140" rx="6" fill="#DDE7E3" stroke="#3F7268" stroke-width="2"/>
  <text x="250" y="150" text-anchor="middle" font-size="13" font-weight="700" fill="#1B1D1F">External</text>
  <text x="250" y="168" text-anchor="middle" font-size="13" font-weight="700" fill="#1B1D1F">Unauthenticated</text>
  <text x="250" y="195" text-anchor="middle" font-size="11" fill="#5B5A52">Attaccante casuale</text>
  <text x="250" y="211" text-anchor="middle" font-size="11" fill="#5B5A52">su Internet</text>
  <text x="250" y="230" text-anchor="middle" font-size="10" fill="#3F7268" font-weight="600">Combinazione più comune</text>

  <!-- Quadrant: Internal + Authenticated (most common) -->
  <rect x="390" y="270" width="240" height="140" rx="6" fill="#DDE7E3" stroke="#3F7268" stroke-width="2"/>
  <text x="510" y="310" text-anchor="middle" font-size="13" font-weight="700" fill="#1B1D1F">Internal</text>
  <text x="510" y="328" text-anchor="middle" font-size="13" font-weight="700" fill="#1B1D1F">Authenticated</text>
  <text x="510" y="355" text-anchor="middle" font-size="11" fill="#5B5A52">Dipendente o attaccante</text>
  <text x="510" y="371" text-anchor="middle" font-size="11" fill="#5B5A52">già dentro la rete</text>
  <text x="510" y="390" text-anchor="middle" font-size="10" fill="#3F7268" font-weight="600">Combinazione più comune</text>

  <!-- Other two quadrants (less common) -->
  <rect x="390" y="110" width="240" height="140" rx="6" fill="#ffffff" stroke="#D8D1BE" stroke-width="1.5"/>
  <text x="510" y="185" text-anchor="middle" font-size="12" fill="#5B5A52">Internal +</text>
  <text x="510" y="203" text-anchor="middle" font-size="12" fill="#5B5A52">Unauthenticated</text>

  <rect x="130" y="270" width="240" height="140" rx="6" fill="#ffffff" stroke="#D8D1BE" stroke-width="1.5"/>
  <text x="250" y="345" text-anchor="middle" font-size="12" fill="#5B5A52">External +</text>
  <text x="250" y="363" text-anchor="middle" font-size="12" fill="#5B5A52">Authenticated</text>
</svg>
