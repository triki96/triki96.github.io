<svg width="680" height="260" viewBox="0 0 680 260" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="680" height="260" fill="#ffffff"/>
  <text x="340" y="24" text-anchor="middle" font-size="14" font-weight="600" fill="#222">Decifrare HTTPS con SSLKEYLOGFILE</text>

  <rect x="40" y="50" width="150" height="44" rx="6" fill="#f2f2f2" stroke="#999" stroke-width="1"/>
  <text x="115" y="76" text-anchor="middle" font-size="10" font-weight="600" fill="#333">Browser</text>

  <rect x="260" y="50" width="160" height="44" rx="6" fill="#e6f5f0" stroke="#2fa87d" stroke-width="1"/>
  <text x="340" y="76" text-anchor="middle" font-size="10" font-weight="600" fill="#1c5c42">sslkeys.log</text>

