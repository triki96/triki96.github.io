  <line x1="190" y1="72" x2="260" y2="72" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="225" y="64" text-anchor="middle" font-size="8" fill="#555">SSLKEYLOGFILE</text>

