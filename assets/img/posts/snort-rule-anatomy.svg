<svg viewBox="0 0 900 260" width="900" height="260" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="900" height="260" fill="#FAFAF8"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1B1D1F">Anatomia di una regola Snort</text>

  <!-- rule text -->
  <rect x="40" y="60" width="820" height="42" rx="4" fill="#1B1D1F"/>
  <text x="60" y="86" font-family="monospace" font-size="14" fill="#ffffff" xml:space="preserve">alert tcp any any -&gt; 192.168.1.10 22 (msg:"SSH connection attempt"; sid:1000001;)</text>

  <!-- labels with connector lines -->
  <g font-size="12" fill="#1B1D1F">
    <!-- action -->
    <line x1="75" y1="102" x2="75" y2="130" stroke="#3F7268" stroke-width="1.5"/>
    <rect x="45" y="130" width="80" height="28" rx="4" fill="#DDE7E3" stroke="#3F7268" stroke-width="1.5"/>
    <text x="85" y="148" text-anchor="middle" font-size="11" fill="#1B1D1F">Action</text>

    <!-- protocol -->
    <line x1="140" y1="102" x2="140" y2="130" stroke="#C99A3D" stroke-width="1.5"/>
    <rect x="110" y="130" width="80" height="28" rx="4" fill="#F0E4C4" stroke="#C99A3D" stroke-width="1.5"/>
    <text x="150" y="148" text-anchor="middle" font-size="11" fill="#1B1D1F">Protocol</text>

    <!-- source ip/port -->
    <line x1="235" y1="102" x2="270" y2="170" stroke="#B6553C" stroke-width="1.5"/>
    <rect x="220" y="170" width="110" height="28" rx="4" fill="#F0DDD5" stroke="#B6553C" stroke-width="1.5"/>
    <text x="275" y="188" text-anchor="middle" font-size="11" fill="#1B1D1F">Source IP/Port</text>

    <!-- direction -->
    <line x1="310" y1="102" x2="310" y2="130" stroke="#1B1D1F" stroke-width="1.5"/>
    <rect x="280" y="130" width="80" height="28" rx="4" fill="#F2EEE4" stroke="#1B1D1F" stroke-width="1.5"/>
    <text x="320" y="148" text-anchor="middle" font-size="11" fill="#1B1D1F">Direction</text>

    <!-- destination ip/port -->
    <line x1="420" y1="102" x2="450" y2="170" stroke="#B6553C" stroke-width="1.5"/>
    <rect x="395" y="170" width="130" height="28" rx="4" fill="#F0DDD5" stroke="#B6553C" stroke-width="1.5"/>
    <text x="460" y="188" text-anchor="middle" font-size="11" fill="#1B1D1F">Destination IP/Port</text>

    <!-- rule options / metadata -->
    <line x1="620" y1="102" x2="650" y2="130" stroke="#3F7268" stroke-width="1.5"/>
    <rect x="570" y="130" width="220" height="28" rx="4" fill="#DDE7E3" stroke="#3F7268" stroke-width="1.5"/>
    <text x="680" y="148" text-anchor="middle" font-size="11" fill="#1B1D1F">Rule Options / Metadata (msg, sid)</text>
  </g>

  <text x="450" y="230" text-anchor="middle" font-size="12" fill="#5B5A52">Header della regola (action, protocol, IP/porta, direzione) + corpo tra parentesi (opzioni e metadata)</text>
</svg>
