<svg width="680" height="380" viewBox="0 0 680 380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="680" height="380" fill="#ffffff"/>
  <text x="340" y="24" text-anchor="middle" font-size="14" font-weight="600" fill="#222">Traceroute — incremento del TTL a ogni tentativo</text>

  <rect x="30" y="45" width="110" height="36" rx="6" fill="#f2f2f2" stroke="#999" stroke-width="1"/>
  <text x="85" y="68" text-anchor="middle" font-size="9.5" font-weight="600" fill="#333">Client</text>

  <rect x="280" y="45" width="110" height="36" rx="6" fill="#e7f0fd" stroke="#4a86e8" stroke-width="1"/>
  <text x="335" y="68" text-anchor="middle" font-size="9.5" font-weight="600" fill="#1a3d7c">Router 1</text>

  <rect x="530" y="45" width="110" height="36" rx="6" fill="#e6f5f0" stroke="#2fa87d" stroke-width="1"/>
  <text x="585" y="68" text-anchor="middle" font-size="9.5" font-weight="600" fill="#1c5c42">Router 2</text>

  <text x="220" y="105" text-anchor="middle" font-size="10" font-weight="600" fill="#222">Pacchetto 1: TTL = 1</text>
  <line x1="85" y1="118" x2="335" y2="118" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="335" y1="140" x2="85" y2="140" stroke="#e06c4f" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="210" y="155" text-anchor="middle" font-size="8.5" fill="#8a3a26">TTL arriva a 0 → Router 1 scarta e risponde: ICMP Time Exceeded (rivela il suo IP)</text>

  <line x1="30" y1="175" x2="650" y2="175" stroke="#ddd" stroke-width="1"/>

  <text x="335" y="200" text-anchor="middle" font-size="10" font-weight="600" fill="#222">Pacchetto 2: TTL = 2</text>
  <line x1="85" y1="213" x2="585" y2="213" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="585" y1="235" x2="85" y2="235" stroke="#2fa87d" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="335" y="250" text-anchor="middle" font-size="8.5" fill="#1c5c42">Router 1 lo lascia passare (TTL 2→1), Router 2 lo scarta → Time Exceeded</text>

  <line x1="30" y1="270" x2="650" y2="270" stroke="#ddd" stroke-width="1"/>

  <text x="335" y="295" text-anchor="middle" font-size="10" font-weight="600" fill="#222">Pacchetto 3: TTL sufficiente per arrivare a destinazione</text>
  <rect x="530" y="308" width="110" height="34" rx="6" fill="#fff3d6" stroke="#d9a441" stroke-width="1"/>
  <text x="585" y="329" text-anchor="middle" font-size="9.5" font-weight="600" fill="#7a5a12">Destinazione</text>

  <line x1="85" y1="325" x2="585" y2="325" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>

  <text x="340" y="368" text-anchor="middle" font-size="9" fill="#888">Ogni hop rivela il proprio IP tramite un messaggio ICMP Time Exceeded distinto</text>
</svg>
