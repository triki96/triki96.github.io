<svg width="640" height="360" viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="640" height="360" fill="#ffffff"/>
  <text x="320" y="26" text-anchor="middle" font-size="15" font-weight="600" fill="#222">Alternate Data Streams su NTFS</text>

  <rect x="220" y="45" width="200" height="50" rx="8" fill="#e7f0fd" stroke="#4a86e8" stroke-width="1"/>
  <text x="320" y="65" text-anchor="middle" font-size="12" font-weight="600" fill="#1a3d7c">documento.txt</text>
  <text x="320" y="81" text-anchor="middle" font-size="10.5" fill="#1a3d7c">visibile in Esplora risorse</text>

  <line x1="320" y1="95" x2="320" y2="126" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="320" y1="95" x2="480" y2="126" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="180" y="126" width="280" height="46" rx="8" fill="#e6f5f0" stroke="#2fa87d" stroke-width="1"/>
  <text x="320" y="144" text-anchor="middle" font-size="11" font-weight="600" fill="#1c5c42">Stream principale ($DATA)</text>
  <text x="320" y="160" text-anchor="middle" font-size="10.5" fill="#1c5c42">il contenuto normale del file</text>

  <rect x="410" y="126" width="210" height="58" rx="8" fill="#fdece7" stroke="#e06c4f" stroke-width="1"/>
  <text x="515" y="146" text-anchor="middle" font-size="11" font-weight="600" fill="#8a3a26">Stream alternativo</text>
  <text x="515" y="161" text-anchor="middle" font-size="10" fill="#8a3a26">documento.txt:segreto.exe</text>
  <text x="515" y="175" text-anchor="middle" font-size="10" fill="#8a3a26">NON visibile normalmente</text>

  <line x1="30" y1="200" x2="610" y2="200" stroke="#ddd" stroke-width="1"/>

  <text x="320" y="224" text-anchor="middle" font-size="12" font-weight="600" fill="#222">La dimensione riportata da dir / Esplora risorse</text>
  <rect x="180" y="240" width="280" height="40" rx="6" fill="#f2f2f2" stroke="#999" stroke-width="1"/>
  <text x="320" y="264" text-anchor="middle" font-size="11" fill="#333">Include SOLO lo stream principale</text>

  <text x="320" y="308" text-anchor="middle" font-size="11" fill="#333">Per accedere allo stream nascosto serve specificarlo esplicitamente:</text>
  <rect x="140" y="320" width="360" height="30" rx="6" fill="#f2e9fb" stroke="#8e5fd6" stroke-width="1"/>
  <text x="320" y="339" text-anchor="middle" font-size="11" font-weight="600" fill="#4a2e7a">notepad documento.txt:segreto.exe</text>
</svg>
