<svg viewBox="0 0 760 360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="360" fill="#ffffff"/>
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">Escalation dei privilegi</text>

  <!-- connettori -->
  <line x1="380" y1="50" x2="380" y2="72" stroke="#6b7280" stroke-width="2"/>
  <line x1="190" y1="72" x2="570" y2="72" stroke="#6b7280" stroke-width="2"/>
  <line x1="190" y1="72" x2="190" y2="92" stroke="#6b7280" stroke-width="2"/>
  <line x1="570" y1="72" x2="570" y2="92" stroke="#6b7280" stroke-width="2"/>

  <!-- vulnerabilità -->
  <rect x="40" y="92" width="300" height="60" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="190" y="118" text-anchor="middle" font-size="16" font-weight="bold" fill="#991b1b">Basata sulle vulnerabilità</text>
  <text x="190" y="138" text-anchor="middle" font-size="13" fill="#991b1b">Sfruttamento (exploitation)</text>

  <rect x="40" y="170" width="300" height="100" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
  <text x="56" y="196" font-size="14" fill="#374151">• Vulnerabilità del kernel</text>
  <text x="56" y="220" font-size="14" fill="#374151">• Buffer overflow nelle applicazioni</text>
  <text x="56" y="244" font-size="14" fill="#374151">• CVE noti nei servizi in esecuzione</text>

  <rect x="40" y="288" width="300" height="46" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-dasharray="5 4"/>
  <text x="190" y="316" text-anchor="middle" font-size="14" font-style="italic" fill="#991b1b">"Cosa c'è di sbagliato in questo software?"</text>

  <!-- configurazione -->
  <rect x="420" y="92" width="300" height="60" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="570" y="118" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e3a8a">Basata sulla configurazione</text>
  <text x="570" y="138" text-anchor="middle" font-size="13" fill="#1e3a8a">Revisione della configurazione</text>

  <rect x="420" y="170" width="300" height="100" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="436" y="196" font-size="14" fill="#374151">• Permessi di file troppo permissivi</text>
  <text x="436" y="220" font-size="14" fill="#374151">• Configurazioni di servizio non sicure</text>
  <text x="436" y="244" font-size="14" fill="#374151">• Credenziali in chiaro accessibili</text>

  <rect x="420" y="288" width="300" height="46" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-dasharray="5 4"/>
  <text x="570" y="316" text-anchor="middle" font-size="14" font-style="italic" fill="#1e3a8a">"Cosa è configurato male su questo sistema?"</text>
</svg>
