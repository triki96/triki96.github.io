<svg width="680" height="420" viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="680" height="420" fill="#ffffff"/>

  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="600" fill="#222">System Configuration — scheda Tools</text>

  <!-- Window frame -->
  <rect x="40" y="45" width="600" height="340" rx="6" fill="#f7f7f7" stroke="#999" stroke-width="1.2"/>
  <rect x="40" y="45" width="600" height="26" rx="6" fill="#e2e2e2" stroke="#999" stroke-width="1"/>
  <text x="60" y="63" font-size="11" font-weight="600" fill="#333">System Configuration</text>
  <circle cx="610" cy="58" r="5" fill="#e06c4f"/>
  <circle cx="590" cy="58" r="5" fill="#d9a441"/>
  <circle cx="570" cy="58" r="5" fill="#2fa87d"/>

  <!-- Tabs -->
  <g>
    <rect x="50" y="78" width="105" height="26" fill="#f7f7f7" stroke="#999" stroke-width="1"/>
    <text x="102" y="95" text-anchor="middle" font-size="9.5" fill="#444">General</text>

    <rect x="155" y="78" width="90" height="26" fill="#f7f7f7" stroke="#999" stroke-width="1"/>
    <text x="200" y="95" text-anchor="middle" font-size="9.5" fill="#444">Boot</text>

    <rect x="245" y="78" width="100" height="26" fill="#f7f7f7" stroke="#999" stroke-width="1"/>
    <text x="295" y="95" text-anchor="middle" font-size="9.5" fill="#444">Services</text>

    <rect x="345" y="78" width="100" height="26" fill="#f7f7f7" stroke="#999" stroke-width="1"/>
    <text x="395" y="95" text-anchor="middle" font-size="9.5" fill="#444">Startup</text>

    <rect x="445" y="78" width="90" height="26" fill="#e7f0fd" stroke="#4a86e8" stroke-width="1"/>
    <text x="490" y="95" text-anchor="middle" font-size="9.5" font-weight="600" fill="#1a3d7c">Tools</text>
  </g>

  <!-- Content: list of tools -->
  <rect x="50" y="104" width="580" height="250" fill="#ffffff" stroke="#ccc" stroke-width="1"/>

  <text x="65" y="122" font-size="9.5" font-weight="600" fill="#666">Tool</text>
  <text x="480" y="122" font-size="9.5" font-weight="600" fill="#666">Command</text>
  <line x1="60" y1="128" x2="620" y2="128" stroke="#ddd" stroke-width="1"/>

  <g font-size="9.5" fill="#333">
    <text x="65" y="146">About Windows</text>
    <text x="480" y="146" font-family="Consolas, monospace" fill="#555">winver</text>

    <text x="65" y="168">System Properties</text>
    <text x="480" y="168" font-family="Consolas, monospace" fill="#555">sysdm.cpl</text>

    <text x="65" y="190">Computer Management</text>
    <text x="480" y="190" font-family="Consolas, monospace" fill="#555">compmgmt.msc</text>

    <text x="65" y="212">Change UAC Settings</text>
    <text x="480" y="212" font-family="Consolas, monospace" fill="#555">UserAccountControlSettings.exe</text>

    <text x="65" y="234">System Information</text>
    <text x="480" y="234" font-family="Consolas, monospace" fill="#555">msinfo32</text>

    <text x="65" y="256">Resource Monitor</text>
    <text x="480" y="256" font-family="Consolas, monospace" fill="#555">resmon</text>

    <text x="65" y="278">Command Prompt</text>
    <text x="480" y="278" font-family="Consolas, monospace" fill="#555">cmd.exe</text>

    <text x="65" y="300">Registry Editor</text>
    <text x="480" y="300" font-family="Consolas, monospace" fill="#555">regedit</text>

    <text x="65" y="322">...</text>
  </g>

  <rect x="450" y="365" width="180" height="30" rx="4" fill="#e6f5f0" stroke="#2fa87d" stroke-width="1"/>
  <text x="540" y="384" text-anchor="middle" font-size="10" font-weight="600" fill="#1c5c42">Launch</text>

  <text x="340" y="410" text-anchor="middle" font-size="9.5" fill="#888">Illustrazione schematica, non uno screenshot reale dell'interfaccia Windows</text>
</svg>
