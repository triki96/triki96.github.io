<svg width="680" height="360" viewBox="0 0 680 360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="680" height="360" fill="#ffffff"/>
  <text x="340" y="24" text-anchor="middle" font-size="14" font-weight="600" fill="#222">Sequenza DHCP — DORA</text>

  <rect x="60" y="45" width="150" height="40" rx="6" fill="#f2f2f2" stroke="#999" stroke-width="1"/>
  <text x="135" y="70" text-anchor="middle" font-size="10.5" font-weight="600" fill="#333">Client</text>

  <rect x="470" y="45" width="150" height="40" rx="6" fill="#e7f0fd" stroke="#4a86e8" stroke-width="1"/>
  <text x="545" y="70" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1a3d7c">Server DHCP</text>

  <line x1="135" y1="85" x2="135" y2="320" stroke="#ddd" stroke-width="1" stroke-dasharray="3 2"/>
  <line x1="545" y1="85" x2="545" y2="320" stroke="#ddd" stroke-width="1" stroke-dasharray="3 2"/>

  <!-- 1 Discover -->
  <line x1="135" y1="115" x2="545" y2="115" stroke="#2fa87d" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="200" y="98" width="280" height="20" rx="4" fill="#e6f5f0"/>
  <text x="340" y="112" text-anchor="middle" font-size="9.5" font-weight="600" fill="#1c5c42">1. DISCOVER (broadcast)</text>
  <text x="340" y="132" text-anchor="middle" font-size="8.5" fill="#666">"C'è un server DHCP in ascolto?"</text>

  <!-- 2 Offer -->
  <line x1="545" y1="165" x2="135" y2="165" stroke="#4a86e8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="200" y="148" width="280" height="20" rx="4" fill="#e7f0fd"/>
  <text x="340" y="162" text-anchor="middle" font-size="9.5" font-weight="600" fill="#1a3d7c">2. OFFER</text>
  <text x="340" y="182" text-anchor="middle" font-size="8.5" fill="#666">"Ti propongo l'IP 192.168.1.50"</text>

  <!-- 3 Request -->
  <line x1="135" y1="215" x2="545" y2="215" stroke="#d9a441" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="200" y="198" width="280" height="20" rx="4" fill="#fff3d6"/>
  <text x="340" y="212" text-anchor="middle" font-size="9.5" font-weight="600" fill="#7a5a12">3. REQUEST (broadcast)</text>
  <text x="340" y="232" text-anchor="middle" font-size="8.5" fill="#666">"Confermo, voglio proprio quell'IP"</text>

  <!-- 4 Ack -->
  <line x1="545" y1="265" x2="135" y2="265" stroke="#e06c4f" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="200" y="248" width="280" height="20" rx="4" fill="#fdece7"/>
  <text x="340" y="262" text-anchor="middle" font-size="9.5" font-weight="600" fill="#8a3a26">4. ACK (Acknowledge)</text>
  <text x="340" y="282" text-anchor="middle" font-size="8.5" fill="#666">"Confermato: IP, mask, gateway, DNS"</text>

  <text x="340" y="315" text-anchor="middle" font-size="9.5" fill="#666">Le prime due fasi (Discover, Request) sono broadcast: il client non ha ancora un IP</text>
  <text x="340" y="332" text-anchor="middle" font-size="9" fill="#888">Illustrazione schematica</text>
</svg>
