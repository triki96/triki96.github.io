<svg viewBox="0 0 900 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="900" height="400" fill="#FAFAF8"/>
  <text x="450" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#1B1D1F">Dall'Alert all'Incidente</text>

  <!-- Alert box -->
  <rect x="40" y="160" width="140" height="70" rx="6" fill="#ffffff" stroke="#1B1D1F" stroke-width="2"/>
  <text x="110" y="190" text-anchor="middle" font-size="14" font-weight="700" fill="#1B1D1F">Alert</text>
  <text x="110" y="210" text-anchor="middle" font-size="11" fill="#5B5A52">generato da una</text>
  <text x="110" y="223" text-anchor="middle" font-size="11" fill="#5B5A52">soluzione di sicurezza</text>

  <!-- Arrow to triage -->
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1B1D1F"/>
    </marker>
  </defs>
  <line x1="180" y1="195" x2="240" y2="195" stroke="#1B1D1F" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- Triage diamond-ish box -->
  <rect x="245" y="160" width="150" height="70" rx="6" fill="#F2EEE4" stroke="#1B1D1F" stroke-width="2"/>
  <text x="320" y="190" text-anchor="middle" font-size="14" font-weight="700" fill="#1B1D1F">Analisi</text>
  <text x="320" y="208" text-anchor="middle" font-size="11" fill="#5B5A52">Il team analizza</text>
  <text x="320" y="221" text-anchor="middle" font-size="11" fill="#5B5A52">l'alert</text>

  <!-- Branch up: false positive -->
  <line x1="395" y1="180" x2="470" y2="100" stroke="#3F7268" stroke-width="2" marker-end="url(#arrow2)"/>
  <rect x="475" y="65" width="190" height="70" rx="6" fill="#ffffff" stroke="#3F7268" stroke-width="2"/>
  <text x="570" y="93" text-anchor="middle" font-size="14" font-weight="700" fill="#3F7268">Falso Positivo</text>
  <text x="570" y="111" text-anchor="middle" font-size="11" fill="#5B5A52">Segnala qualcosa</text>
  <text x="570" y="124" text-anchor="middle" font-size="11" fill="#5B5A52">non realmente dannoso</text>

  <!-- Branch down: true positive -->
  <line x1="395" y1="210" x2="470" y2="290" stroke="#B6553C" stroke-width="2" marker-end="url(#arrow2)"/>
  <rect x="475" y="255" width="190" height="70" rx="6" fill="#ffffff" stroke="#B6553C" stroke-width="2"/>
  <text x="570" y="283" text-anchor="middle" font-size="14" font-weight="700" fill="#B6553C">Vero Positivo</text>
  <text x="570" y="301" text-anchor="middle" font-size="11" fill="#5B5A52">Segnala qualcosa</text>
  <text x="570" y="314" text-anchor="middle" font-size="11" fill="#5B5A52">realmente dannoso</text>

  <!-- true positive -> incident -->
  <line x1="665" y1="290" x2="710" y2="290" stroke="#B6553C" stroke-width="2" marker-end="url(#arrow2)"/>
  <rect x="715" y="255" width="150" height="70" rx="6" fill="#B6553C" stroke="#B6553C" stroke-width="2"/>
  <text x="790" y="283" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Incidente</text>
  <text x="790" y="301" text-anchor="middle" font-size="11" fill="#F0DDD5">Livello di gravità</text>
  <text x="790" y="314" text-anchor="middle" font-size="11" fill="#F0DDD5">assegnato</text>

  <!-- Severity scale -->
  <text x="450" y="365" text-anchor="middle" font-size="13" font-weight="600" fill="#1B1D1F">Gravità dell'incidente</text>
  <rect x="300" y="375" width="75" height="16" fill="#DDE7E3"/>
  <text x="337" y="387" text-anchor="middle" font-size="11" fill="#1B1D1F">Bassa</text>
  <rect x="375" y="375" width="75" height="16" fill="#C99A3D"/>
  <text x="412" y="387" text-anchor="middle" font-size="11" fill="#1B1D1F">Media</text>
  <rect x="450" y="375" width="75" height="16" fill="#D98A5F"/>
  <text x="487" y="387" text-anchor="middle" font-size="11" fill="#ffffff">Alta</text>
  <rect x="525" y="375" width="75" height="16" fill="#B6553C"/>
  <text x="562" y="387" text-anchor="middle" font-size="11" fill="#ffffff">Critica</text>
</svg>
