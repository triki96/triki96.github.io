<svg viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="900" height="480" fill="#f3f3f3"/>
  <!-- window frame -->
  <rect x="10" y="10" width="880" height="460" rx="6" fill="#ffffff" stroke="#c0c0c0"/>
  <!-- title bar -->
  <rect x="10" y="10" width="880" height="32" rx="6" fill="#2b579a"/>
  <text x="26" y="31" fill="#ffffff" font-size="14" font-weight="bold">Process Explorer</text>
  <circle cx="850" cy="26" r="6" fill="#ffffff" opacity="0.6"/>
  <circle cx="825" cy="26" r="6" fill="#ffffff" opacity="0.6"/>
  <circle cx="800" cy="26" r="6" fill="#ffffff" opacity="0.6"/>

  <!-- column headers -->
  <rect x="10" y="42" width="880" height="24" fill="#eaeaea"/>
  <text x="26" y="58" font-size="12" fill="#444">Process</text>
  <text x="330" y="58" font-size="12" fill="#444">PID</text>
  <text x="420" y="58" font-size="12" fill="#444">CPU</text>
  <text x="500" y="58" font-size="12" fill="#444">Description</text>

  <!-- process tree rows -->
  <g font-size="13" fill="#222">
    <text x="26" y="88">▸ explorer.exe</text>
    <text x="330" y="88">2140</text>
    <text x="500" y="88">Windows Explorer</text>

    <text x="46" y="112">└ cobaltstrike.exe</text>
    <text x="330" y="112">4756</text>
    <text x="500" y="112">(unsigned) suspicious binary</text>
  </g>
  <rect x="16" y="99" width="860" height="22" fill="#dbe9ff"/>
  <text x="46" y="115" font-size="13" font-weight="bold" fill="#111">└ cobaltstrike.exe</text>
  <text x="330" y="115" font-size="13" fill="#111">4756</text>
  <text x="500" y="115" font-size="13" fill="#111">(unsigned) suspicious binary</text>

  <!-- context menu hint -->
  <rect x="140" y="130" width="180" height="60" fill="#ffffff" stroke="#999"/>
  <text x="150" y="148" font-size="12" fill="#333">Kill Process</text>
  <text x="150" y="166" font-size="12" fill="#333" font-weight="bold">Properties...</text>
  <line x1="145" y1="172" x2="315" y2="172" stroke="#ddd"/>
  <text x="150" y="184" font-size="12" fill="#333">Search Online...</text>

  <!-- Properties dialog -->
  <rect x="360" y="150" width="480" height="300" rx="4" fill="#ffffff" stroke="#888"/>
  <rect x="360" y="150" width="480" height="28" rx="4" fill="#3c3c3c"/>
  <text x="374" y="169" fill="#fff" font-size="13">cobaltstrike.exe:4756 Properties</text>

  <!-- tabs -->
  <g font-size="12">
    <rect x="374" y="184" width="70" height="24" fill="#e6e6e6" stroke="#bbb"/>
    <text x="385" y="200">Image</text>
    <rect x="444" y="184" width="90" height="24" fill="#e6e6e6" stroke="#bbb"/>
    <text x="455" y="200">Performance</text>
    <rect x="534" y="184" width="70" height="24" fill="#ffffff" stroke="#bbb"/>
    <text x="546" y="200" font-weight="bold">TCP/IP</text>
    <rect x="604" y="184" width="60" height="24" fill="#e6e6e6" stroke="#bbb"/>
    <text x="614" y="200">Threads</text>
  </g>

  <!-- TCP/IP table -->
  <rect x="374" y="216" width="450" height="26" fill="#f0f0f0"/>
  <text x="382" y="233" font-size="11" fill="#555">Protocol</text>
  <text x="452" y="233" font-size="11" fill="#555">Local Address</text>
  <text x="592" y="233" font-size="11" fill="#555">Remote Address</text>
  <text x="722" y="233" font-size="11" fill="#555">State</text>

  <rect x="374" y="242" width="450" height="26" fill="#fff3f3" stroke="#f0c0c0"/>
  <text x="382" y="259" font-size="12" fill="#222">TCP</text>
  <text x="452" y="259" font-size="12" fill="#222">10.10.10.5:51422</text>
  <text x="592" y="259" font-size="12" font-weight="bold" fill="#b00020">47.120.46.210:81</text>
  <text x="722" y="259" font-size="12" fill="#222">ESTABLISHED</text>

  <rect x="374" y="290" width="450" height="70" fill="#fafafa" stroke="#ddd"/>
  <text x="384" y="308" font-size="11" fill="#666">Nota:</text>
  <text x="384" y="326" font-size="12" fill="#333">Connessione in uscita verso un IP esterno</text>
  <text x="384" y="344" font-size="12" fill="#333">sconosciuto, su una porta non standard (81).</text>

</svg>
