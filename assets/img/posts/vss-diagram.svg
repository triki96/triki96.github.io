<svg width="680" height="170" viewBox="0 0 680 170" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="680" height="170" fill="#ffffff"/>
  <rect x="30" y="20" width="620" height="120" rx="6" fill="#f7f7f7" stroke="#999" stroke-width="1.2"/>
  <rect x="30" y="20" width="620" height="26" rx="6" fill="#e2e2e2" stroke="#999" stroke-width="1"/>
  <text x="50" y="38" font-size="11" font-weight="600" fill="#333">Volume Shadow Copy Service</text>
  <circle cx="640" cy="33" r="5" fill="#e06c4f"/>
  <circle cx="620" cy="33" r="5" fill="#d9a441"/>
  <circle cx="600" cy="33" r="5" fill="#2fa87d"/>
  
  <rect x="50" y="60" width="150" height="50" rx="4" fill="#e7f0fd" stroke="#4a86e8" stroke-width="1"/>
  <text x="125" y="90" text-anchor="middle" font-size="9.5" fill="#1a3d7c">Disco al tempo T0</text>

  <text x="215" y="90" text-anchor="middle" font-size="14" fill="#555">-&gt;</text>

  <rect x="240" y="60" width="150" height="50" rx="4" fill="#e6f5f0" stroke="#2fa87d" stroke-width="1"/>
  <text x="315" y="90" text-anchor="middle" font-size="9.5" fill="#1c5c42">Shadow copy (T0)</text>

  <text x="405" y="90" text-anchor="middle" font-size="14" fill="#555">-&gt;</text>

  <rect x="430" y="60" width="150" height="50" rx="4" fill="#fdece7" stroke="#e06c4f" stroke-width="1"/>
  <text x="505" y="90" text-anchor="middle" font-size="9.5" fill="#8a3a26">Disco al tempo T1</text>

  <text x="340" y="140" text-anchor="middle" font-size="9" fill="#555">Solo i blocchi modificati dopo T0 vengono salvati (copy-on-write)</text>
  <text x="340" y="155" text-anchor="middle" font-size="9.5" fill="#888">Illustrazione schematica, non uno screenshot reale dell'interfaccia Windows</text>
